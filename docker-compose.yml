
# Works on VPS and local development.
#
# VPS:   BIND=127.0.0.1 docker compose up -d
# LOCAL: BIND=0.0.0.0 docker compose up -d
#
# PostgreSQL and Redis are accessible only through
# the internal Docker network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: online_assessment-postgres-1
    env_file:
    - ./backend/.env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assessment_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: online_assessment-redis-1
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: online_assessment-ollama-1
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: online_assessment-backend-1
    ports:
      - "${BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/data:/data
      - ./backend/pipelines:/app/pipelines
      - ./backend/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: online_assessment-frontend-1
    ports:
      - "${BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollama_data:
